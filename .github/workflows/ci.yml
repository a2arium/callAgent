name: CI

on:
  push:
    branches: [main, master, feature/*, release/*]
  pull_request:
    branches: [main, master]

jobs:
  package-readiness:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v6

      - name: Enable Corepack before dependency cache
        run: corepack enable

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build packages
        run: yarn build

      - name: Verify publish manifests
        run: yarn verify:publish-manifests

      - name: Verify package packlists
        run: yarn verify:packlists

      - name: Verify core import safety
        run: yarn verify:core-imports

      - name: Verify core public types
        run: yarn workspace @a2arium/callagent-core test:types

      - name: Run tests
        run: yarn test
        env:
          CI: true

  semantic-cas-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: callagent
          POSTGRES_PASSWORD: callagent
          POSTGRES_DB: callagent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U callagent -d callagent_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MEMORY_DATABASE_URL: postgresql://callagent:callagent@localhost:5432/callagent_test
      CI: true
    steps:
      - uses: actions/checkout@v6
      - name: Enable Corepack
        run: corepack enable
      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: yarn
      - name: Install dependencies
        run: yarn install --immutable
      - name: Apply memory SQL migrations
        run: yarn workspace @a2arium/callagent-memory-sql db:migrate
      - name: Build packages
        run: yarn build
      - name: Run real PostgreSQL memory tests
        run: yarn workspace @a2arium/callagent-memory-sql test --runInBand
